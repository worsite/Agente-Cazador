<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(98.5% .003 30);
  --surface:oklch(100% 0 0);
  --surface-2:oklch(95.5% .006 30);
  --ink:oklch(17% .01 30);
  --muted:oklch(44% .01 30);
  --line:oklch(88% .006 30);
  --brand:oklch(52% .22 27);
  --brand-ink:#fff;
  --accent:oklch(54% .22 27);
  --accent-ink:#fff;
  --accent-2:oklch(74% .17 58);
  --accent-text:oklch(50% .21 27);
  --ok:oklch(48% .13 155);
  --shadow:0 1px 2px oklch(20% .04 260/.06),0 8px 24px oklch(20% .04 260/.08);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:oklch(13% 0 0);
  --surface:oklch(19% .006 25);
  --surface-2:oklch(24% .01 25);
  --ink:oklch(97% 0 0);
  --muted:oklch(78% .008 25);
  --line:oklch(32% .012 25);
  --brand:oklch(58% .23 27);
  --brand-ink:#fff;
  --accent:oklch(58% .23 27);
  --accent-ink:#fff;
  --accent-2:oklch(76% .17 58);
  --accent-text:oklch(76% .17 50);
  --ok:oklch(78% .14 155);
  --shadow:0 1px 2px oklch(0% 0 0/.3),0 8px 24px oklch(0% 0 0/.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden;transition:background .3s var(--ease),color .3s var(--ease)}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:700;line-height:1.1;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* HEADER */
header{position:sticky;top:0;z-index:50;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Fraunces',serif;font-weight:700;font-size:1.25rem;color:var(--ink)}
.logo img{height:48px;width:auto;border-radius:10px;display:block;background:#000}
.logo span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tools{display:flex;align-items:center;gap:8px}
.tbtn{height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:.88rem;transition:transform .2s var(--ease),border-color .2s}
.tbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.tbtn svg{width:18px;height:18px}
select.tbtn{appearance:none;padding-right:12px;cursor:pointer}
#themeBtn .moon{display:none}
:root[data-theme="dark"] #themeBtn .sun{display:none}
:root[data-theme="dark"] #themeBtn .moon{display:block}

/* HERO */
.hero{padding:56px 0 40px;background:radial-gradient(900px 420px at 85% 0,color-mix(in oklab,var(--accent) 22%,transparent),transparent 70%),radial-gradient(600px 300px at 0 100%,color-mix(in oklab,var(--accent-2) 14%,transparent),transparent 70%)}
.hero-grid{display:grid;gap:32px;align-items:center}
.eyebrow{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);margin-bottom:14px}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);margin-bottom:16px}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin-bottom:24px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:0;font-weight:700;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in oklab,var(--accent) 40%,transparent)}
.btn-primary:hover{background:color-mix(in oklab,var(--accent) 85%,#fff)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-wa{background:oklch(52% .15 155);color:#fff;width:100%}
.hero-art{background:#000;border:1px solid var(--line);border-radius:28px;padding:20px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.hero-art{padding:0;aspect-ratio:9/16;width:min(100%,360px);max-height:80vh;justify-self:center}
.hero-video{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.badge-float{position:absolute;right:18px;top:18px;background:linear-gradient(90deg,var(--accent-2),var(--accent));color:#111;padding:6px 12px;border-radius:999px;font-size:.78rem;font-weight:700}
@media(min-width:860px){.hero-grid{grid-template-columns:1.05fr .95fr}.hero{padding:80px 0 56px}}

/* PERKS */
.perks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 0 24px}
.perk{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.perk span{font-size:1.5rem}
.perk h3{font-family:'Manrope',sans-serif;font-size:.98rem;margin:6px 0 2px}
.perk p{font-size:.85rem;color:var(--muted)}
@media(min-width:760px){.perks{grid-template-columns:repeat(4,1fr)}}

/* CATALOG */
.section{padding:40px 0}
.section h2{font-size:clamp(1.7rem,4vw,2.4rem);margin-bottom:6px}
.section .sub{color:var(--muted);margin-bottom:20px}
.controls{display:grid;gap:12px;margin-bottom:20px}
.search{position:relative}
.search input{width:100%;height:48px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 18px 0 44px}
.search svg{position:absolute;left:15px;top:14px;width:20px;height:20px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.sort{height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.count{font-size:.88rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s var(--ease),box-shadow .3s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card-img{position:relative;background:var(--surface-2);aspect-ratio:1/.82;display:grid;place-items:center;padding:14px;border:0;width:100%}
.card-img svg{width:100%;height:auto}
.tag{position:absolute;left:10px;top:10px;background:var(--accent);color:#fff;font-size:.7rem;font-weight:800;padding:3px 10px;border-radius:999px}
.fav{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.fav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.fav[aria-pressed="true"]{color:oklch(58% .22 25)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.card-body{padding:12px 14px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.cat{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.card h3{font-size:1.1rem}
.price{font-weight:800;font-size:1.1rem;margin-top:auto;padding-top:6px}
.old{font-weight:500;font-size:.85rem;color:var(--muted);text-decoration:line-through;margin-left:6px}
.comfort{display:flex;gap:2px;align-items:center;font-size:.78rem;color:var(--muted)}
.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:2px}
.dots i.on{background:var(--ok)}
.card .btn{min-height:42px;font-size:.9rem;margin-top:10px;width:100%;padding:0 12px}
.empty{text-align:center;padding:48px 0;color:var(--muted)}

/* INSTAGRAM */
.ig-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
@media(min-width:760px){.ig-grid{grid-template-columns:repeat(4,1fr);gap:20px}}
.reel{position:relative;aspect-ratio:9/16;border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#fff;background:linear-gradient(160deg,#1a1a1a,#000)}
.reel::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 20% 0,color-mix(in oklab,var(--accent) 55%,transparent),transparent 60%),radial-gradient(100% 60% at 100% 100%,color-mix(in oklab,var(--accent-2) 40%,transparent),transparent 65%)}
.reel>*{position:relative}
.reel-top{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:700}
.reel-top span{background:rgba(0,0,0,.55);padding:3px 10px;border-radius:999px}
.play{align-self:center;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .25s var(--ease)}
.reel:hover .play{transform:scale(1.08)}
.play svg{width:26px;height:26px;margin-left:3px;fill:#111}
.reel-cap{font-size:.85rem;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.reel-cap small{display:block;font-weight:500;opacity:.85}
.ig-note{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:16px}
.ig-cta{display:flex;justify-content:center}

/* REVIEWS */
.rev-head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:20px}
.score{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 16px}
.score b{font-family:'Fraunces',serif;font-size:2rem;line-height:1}
.stars{color:oklch(75% .17 75);letter-spacing:2px;font-size:1.05rem;white-space:nowrap}
.rev-grid{display:grid;gap:12px;margin-bottom:24px}
@media(min-width:760px){.rev-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1040px){.rev-grid{grid-template-columns:repeat(3,1fr)}}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px;align-content:start}
.rev-top{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.rev-top small{display:block}
.rev p{font-size:.95rem}
.form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px;max-width:640px}
.form h3{font-size:1.3rem}
.form input[type=text],.form textarea{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:12px 14px}
.form textarea{min-height:96px;resize:vertical}
.rate{display:flex;gap:4px}
.rate button{background:none;border:0;font-size:1.8rem;line-height:1;color:var(--line);padding:2px}
.rate button.on{color:oklch(75% .17 75)}
.form .msg{font-size:.88rem;min-height:1.2em;color:var(--ok)}
.form .msg.err{color:oklch(52% .2 25)}
:root[data-theme="dark"] .form .msg.err{color:oklch(78% .15 25)}

/* ABOUT / CONTACT */
.about{background:var(--surface);border-block:1px solid var(--line)}
.about-grid{display:grid;gap:28px}
@media(min-width:860px){.about-grid{grid-template-columns:1fr 1fr}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.stat{background:var(--surface-2);border-radius:16px;padding:14px;text-align:center}
.stat b{font-family:'Fraunces',serif;font-size:1.6rem;display:block;color:var(--accent-text)}
.stat span{font-size:.8rem;color:var(--muted)}
.contact-list{list-style:none;display:grid;gap:12px;margin-top:8px}
.contact-list li{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);padding:14px;border-radius:14px}
footer{padding:28px 0 40px;color:var(--muted);font-size:.88rem;text-align:center}

/* MODAL */
.overlay{position:fixed;inset:0;background:oklch(10% .02 260/.6);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:0}
.overlay.open{display:flex}
.modal{background:var(--bg);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;position:relative;animation:up .4s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:760px){.overlay{align-items:center;padding:20px}.modal{border-radius:24px}}
.close{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;line-height:1;z-index:2}
.m-grid{display:grid}
@media(min-width:760px){.m-grid{grid-template-columns:1fr 1fr}}
.m-img{background:var(--surface-2);padding:32px 20px;display:grid;place-items:center}
.m-img svg{width:100%;height:auto}
.m-info{padding:24px 20px 28px;display:grid;gap:14px;align-content:start}
.m-info h2{font-size:1.8rem;padding-right:36px}
.m-info .price{font-size:1.4rem;padding:0}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{width:46px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.size[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.label{font-size:.82rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.feat{list-style:none;display:grid;gap:6px;font-size:.92rem}
.feat li::before{content:"✓ ";color:var(--ok);font-weight:800}
.warn{color:oklch(52% .2 25);font-size:.85rem;min-height:1.2em}
:root[data-theme="dark"] .warn{color:oklch(78% .15 25)}

/* MOTION */
.reveal{animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

  d:{es:"Derby de cordones abiertos: más holgado y cómodo que un oxford, igual de elegante.",en:"Open-lace derby: roomier and more comfortable than an oxford, just as elegant.",pt:"Derby de cadarço aberto: mais folgado e confortável que um oxford, igualmente elegante.",fr:"Derby à lacets ouverts : plus ample et confortable qu'un oxford, tout aussi élégant."},
  f:{es:["Horma amplia","Cuero teñido a mano","Suela Goodyear"],en:["Roomy last","Hand-dyed leather","Goodyear welt sole"],pt:["Forma ampla","Couro tingido à mão","Sola Goodyear"],fr:["Forme large","Cuir teinté main","Semelle Goodyear"]}}
];

  let b="";

/* ---------- Estado ---------- */
const $=s=>document.querySelector(s);
const state={lang:"es",theme:"light",cat:"all",q:"",sort:"feat",favs:[],current:null,size:null};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const fmt=n=>new Intl.NumberFormat({es:"es-CO",en:"en-US",pt:"pt-BR",fr:"fr-FR"}[state.lang],{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n);
const t=k=>T[state.lang][k];

/* ---------- Render ---------- */
function applyStatic(){
  document.documentElement.lang=state.lang;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.i18nAria)));
  $("#waGeneral").href=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t("waGen"))}`;
  $("#sizeGuide").href=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t("waSize"))}`;
  $("#sizeGuide").target="_blank";$("#sizeGuide").rel="noopener";
  document.title="El Profe Store · "+t("eyebrow");
}
function renderChips(){
  const cats=["all","sport","formal","casual","boots","sandals","favs"];
  $("#chips").innerHTML="";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.className="chip";b.textContent=t(c);
    b.setAttribute("aria-pressed",state.cat===c);
    b.onclick=()=>{state.cat=c;renderChips();renderGrid()};
    $("#chips").appendChild(b);
  });
}
function list(){
  let l=P.filter(p=>state.cat==="all"||(state.cat==="favs"?state.favs.includes(p.id):p.cat===state.cat));
  const q=state.q.trim().toLowerCase();
  if(q)l=l.filter(p=>(p.name+" "+p.d[state.lang]+" "+t(p.cat)).toLowerCase().includes(q));
  if(state.sort==="asc")l=[...l].sort((a,b)=>a.price-b.price);
  if(state.sort==="desc")l=[...l].sort((a,b)=>b.price-a.price);
  return l;
}
function dots(n){return `<span class="dots" aria-label="${n}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`}
function renderGrid(){
  const l=list(),g=$("#grid");
  $("#count").textContent=t("results")(l.length);
  g.innerHTML="";
  if(!l.length){g.innerHTML=`<p class="empty" style="grid-column:1/-1"></p>`;g.firstChild.textContent=t("none");return}
  l.forEach(p=>{
    const c=document.createElement("article");c.className="card reveal";
    const fav=state.favs.includes(p.id);
    c.innerHTML=`
      <div style="position:relative">
        <button class="card-img" aria-label=""></button>
        ${p.tag?`<span class="tag">${t(p.tag==="new"?"newTag":"saleTag")}</span>`:""}
        <button class="fav" aria-pressed="${fav}"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.7-8 11-8 11z"/></svg></button>
      </div>
      <div class="card-body">
        <span class="cat"></span><h3></h3>
        <div class="comfort"><span></span>${dots(p.comfort)}</div>
        <div class="price"></div>
        <button class="btn btn-primary"></button>
      </div>`;
    const img=c.querySelector(".card-img");
    img.innerHTML=shoe(p.type,p.c,"c"+p.id);
    img.setAttribute("aria-label",p.name);
    c.querySelector(".cat").textContent=t(p.cat);
    c.querySelector("h3").textContent=p.name;
    c.querySelector(".comfort span").textContent=t("comfort")+" ";
    c.querySelector(".price").innerHTML=fmt(p.price)+(p.old?`<span class="old">${fmt(p.old)}</span>`:"");
    const open=()=>openModal(p);
    img.onclick=open;c.querySelector(".btn").textContent=t("view");c.querySelector(".btn").onclick=open;
    const fb=c.querySelector(".fav");
    fb.setAttribute("aria-label","♥ "+p.name);
    fb.onclick=()=>{
      state.favs=state.favs.includes(p.id)?state.favs.filter(x=>x!==p.id):[...state.favs,p.id];
      store.set("favs",state.favs);
      state.cat==="favs"?renderGrid():fb.setAttribute("aria-pressed",state.favs.includes(p.id));
    };
    g.appendChild(c);
  });
}

/* ---------- Modal ---------- */
function openModal(p){
  state.current=p;state.size=null;
  $("#mImg").innerHTML=shoe(p.type,p.c,"m"+p.id);
  fillModal();
  $("#overlay").classList.add("open");
  document.body.style.overflow="hidden";
  $("#closeBtn").focus();
}
function fillModal(){
  const p=state.current;if(!p)return;
  $("#mCat").textContent=t(p.cat);
  $("#mName").textContent=p.name;
  $("#mPrice").innerHTML=fmt(p.price)+(p.old?`<span class="old">${fmt(p.old)}</span>`:"");
  $("#mDesc").textContent=p.d[state.lang];
  $("#mFeat").innerHTML="";
  p.f[state.lang].forEach(x=>{const li=document.createElement("li");li.textContent=x;$("#mFeat").appendChild(li)});
  $("#sizes").innerHTML="";
  for(let s=35;s<=45;s++){
    const b=document.createElement("button");b.className="size";b.textContent=s;
    b.setAttribute("aria-pressed",state.size===s);
    b.onclick=()=>{state.size=s;$("#warn").textContent="";[...$("#sizes").children].forEach(x=>x.setAttribute("aria-pressed",x===b))};
    $("#sizes").appendChild(b);
  }
  $("#warn").textContent="";
}
function closeModal(){$("#overlay").classList.remove("open");document.body.style.overflow="";state.current=null}
$("#closeBtn").onclick=closeModal;
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
$("#mWa").addEventListener("click",e=>{
  const p=state.current;
  if(!state.size){e.preventDefault();$("#warn").textContent=t("needSize");return}
  $("#mWa").href=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t("waMsg")(p.name,state.size,fmt(p.price)))}`;
});

/* ---------- Instagram ---------- */
function renderIg(){
  const g=$("#igGrid");g.innerHTML="";
  [1,2,3,4].forEach(i=>{
    const r=document.createElement("div");r.className="reel";
    r.innerHTML=`<div class="reel-top"><span>Reel</span><span>@elprofestore</span></div>
      <div class="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg></div>
      <div class="reel-cap"></div>`;
    r.querySelector(".reel-cap").textContent=t("ig"+i);
    g.appendChild(r);
  });
}

/* ---------- Comentarios ---------- */
const SEED=[
 {n:"Carolina M.",r:5,t:{es:"Compré los Profesor Negro para trabajar y llevo 10 horas de pie sin dolor. Súper cómodos.",en:"I bought the Profesor Negro for work and I'm on my feet 10 hours with no pain. Super comfortable.",pt:"Comprei o Profesor Negro para trabalhar e fico 10 horas em pé sem dor. Super confortável.",fr:"J'ai pris les Profesor Negro pour le travail : 10 h debout sans douleur. Super confortables."}},
 {n:"Andrés R.",r:5,t:{es:"Me cambiaron la talla sin problema y por WhatsApp respondieron en minutos.",en:"They swapped my size with no fuss and answered on WhatsApp within minutes.",pt:"Trocaram o tamanho sem problema e responderam no WhatsApp em minutos.",fr:"Ils ont échangé ma pointure sans souci et répondu sur WhatsApp en quelques minutes."}},
 {n:"Laura G.",r:4,t:{es:"Las Brisa son livianísimas, perfectas para caminar por la ciudad. Llegaron en 2 días.",en:"The Brisa sandals are super light, perfect for city walks. Arrived in 2 days.",pt:"As Brisa são levíssimas, perfeitas para andar pela cidade. Chegaram em 2 dias.",fr:"Les Brisa sont ultra légères, parfaites pour marcher en ville. Reçues en 2 jours."}}
];
let myRevs=[],rating=0;
function allRevs(){return [...myRevs.map(x=>({n:x.n,r:x.r,tx:x.t,mine:true})),...SEED.map(x=>({n:x.n,r:x.r,tx:x.t[state.lang]}))]}
function renderRevs(){
  const l=allRevs(),g=$("#revGrid");g.innerHTML="";
  l.forEach(x=>{
    const d=document.createElement("article");d.className="rev";
    d.innerHTML=`<div class="rev-top"><div class="avatar"></div><div><b></b><small class="stars" aria-hidden="true"></small></div></div><p></p>`;
    d.querySelector(".avatar").textContent=x.n.trim().charAt(0).toUpperCase();
    d.querySelector("b").textContent=x.n;
    d.querySelector("small").textContent="★".repeat(x.r)+"☆".repeat(5-x.r);
    d.setAttribute("aria-label",x.r+"/5");
    d.querySelector("p").textContent=x.tx;
    g.appendChild(d);
  });
  const avg=l.reduce((a,x)=>a+x.r,0)/l.length;
  $("#avg").textContent=avg.toFixed(1);
  $("#avgStars").textContent="★".repeat(Math.round(avg))+"☆".repeat(5-Math.round(avg));
  $("#avgCount").textContent=t("revCount")(l.length);
}
function renderRate(){
  const c=$("#rate");c.innerHTML="";
  for(let i=1;i<=5;i++){
    const b=document.createElement("button");b.type="button";b.textContent="★";
    b.className=i<=rating?"on":"";b.setAttribute("aria-label",i+"/5");b.setAttribute("aria-pressed",i===rating);
    b.onclick=()=>{rating=i;renderRate()};
    c.appendChild(b);
  }
}
$("#revForm").addEventListener("submit",e=>{
  e.preventDefault();
  const n=$("#rName").value.trim(),tx=$("#rText").value.trim(),m=$("#rMsg");
  if(!n||!tx||!rating){m.className="msg err";m.textContent=t("fNeed");return}
  myRevs=[{n:n.slice(0,40),r:rating,t:tx.slice(0,400)},...myRevs].slice(0,20);
  store.set("revs",myRevs);
  $("#rName").value="";$("#rText").value="";rating=0;renderRate();renderRevs();
  m.className="msg";m.textContent=t("fOk");
});

/* ---------- Controles ---------- */
function setTheme(th){
  state.theme=th;document.documentElement.dataset.theme=th;store.set("theme",th);
}
$("#themeBtn").onclick=()=>setTheme(state.theme==="dark"?"light":"dark");
$("#langSel").onchange=e=>{state.lang=e.target.value;store.set("lang",state.lang);renderAll()};
$("#q").oninput=e=>{state.q=e.target.value;renderGrid()};
$("#sort").onchange=e=>{state.sort=e.target.value;renderGrid()};

function renderAll(){
  applyStatic();renderChips();renderGrid();fillModal();renderIg();renderRevs();renderRate();
  $("#langSel").value=state.lang;
}

/* ---------- Init ---------- */
if(matchMedia("(prefers-reduced-motion: reduce)").matches){const v=document.querySelector(".hero-video");v.removeAttribute("autoplay");v.pause()}
(function init(){
  const savedTheme=store.get("theme",null);
  setTheme(savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
  const savedLang=store.get("lang",null);
  const nav=(navigator.language||"es").slice(0,2);
  state.lang=savedLang||(T[nav]?nav:"es");
  state.favs=store.get("favs",[]);
  myRevs=store.get("revs",[]).filter(x=>x&&typeof x.n==="string"&&typeof x.t==="string"&&x.r>=1&&x.r<=5);
  renderAll();
})();
</script>
</body>
